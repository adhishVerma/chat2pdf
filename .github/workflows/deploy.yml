name: Deploy

# Builds the Docker image, pushes it to GitHub Container Registry and, when the
# EC2 secrets are set, deploys it to the server over SSH.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - id: meta
        run: |
          repo=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          echo "image=$repo:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "latest=$repo:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: check
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "EC2_HOST is not set; skipping deploy. See README > Deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy
        if: steps.check.outputs.skip != 'true'
        env:
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
          APP_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SSH="ssh -i ~/.ssh/deploy_key $EC2_USER@$EC2_HOST"
          scp -i ~/.ssh/deploy_key deploy/docker-compose.prod.yml deploy/Caddyfile "$EC2_USER@$EC2_HOST:/opt/chat2pdf/"
          $SSH "echo '$GHCR_TOKEN' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin"
          $SSH "cd /opt/chat2pdf && APP_IMAGE='$APP_IMAGE' docker compose -f docker-compose.prod.yml pull app \
                && APP_IMAGE='$APP_IMAGE' docker compose -f docker-compose.prod.yml up -d --remove-orphans \
                && docker image prune -f"
          $SSH "docker logout ghcr.io"

      - name: Smoke test
        if: steps.check.outputs.skip != 'true' && vars.APP_URL != ''
        run: |
          for i in $(seq 1 30); do
            curl -fsS "${{ vars.APP_URL }}/api/health" > /dev/null && echo "up" && exit 0
            sleep 5
          done
          echo "site did not come up" && exit 1
