name: CI

on:
  push:
    branches: [main, development]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chat2pdf
          POSTGRES_PASSWORD: chat2pdf
          POSTGRES_DB: chat2pdf
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chat2pdf"
          --health-interval 5s --health-timeout 5s --health-retries 10
      s3:
        image: motoserver/moto:5.1.4
        ports: ["5055:5000"]

    env:
      DATABASE_URL: postgres://chat2pdf:chat2pdf@localhost:5432/chat2pdf
      DATABASE_SSL: "false"
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      S3_BUCKET_NAME: chat2pdf-ci
      S3_REGION: ap-south-1
      S3_ENDPOINT: http://localhost:5055
      OPENAI_API_KEY: sk-test
      OPENAI_BASE_URL: http://localhost:4010/v1
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - run: npm run build

      - name: Start the app and its stand-ins
        run: |
          npm run db:init
          node tests/e2e/create-bucket.mjs
          node tests/e2e/fake-openai.mjs > fake-openai.log 2>&1 &
          npx next start -p 3000 > app.log 2>&1 &
          npx --yes wait-on@8.0.3 --timeout 60000 http-get://localhost:3000/api/health

      - name: End-to-end tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000

      - name: App logs
        if: failure()
        run: cat app.log fake-openai.log || true
