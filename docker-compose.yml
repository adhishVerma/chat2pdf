# Local development: Postgres with pgvector (+ the app with `--profile app`).
# Ports are bound to 127.0.0.1 so the database (default password!) is never
# reachable from the network. For a server, use deploy/docker-compose.prod.yml.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat2pdf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat2pdf}
      POSTGRES_DB: chat2pdf
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgres://chat2pdf:${POSTGRES_PASSWORD:-chat2pdf}@db:5432/chat2pdf
      DATABASE_SSL: "false"
    ports:
      - "127.0.0.1:3000:3000"
    profiles: ["app"]

volumes:
  pgdata:
