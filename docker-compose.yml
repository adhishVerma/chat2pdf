# Local / single-server setup: Postgres with pgvector + the app.
# On AWS you can run this on EC2 as-is, or point DATABASE_URL at RDS and run only the app.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chat2pdf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat2pdf}
      POSTGRES_DB: chat2pdf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - db
    env_file: .env
    environment:
      DATABASE_URL: postgres://chat2pdf:${POSTGRES_PASSWORD:-chat2pdf}@db:5432/chat2pdf
      DATABASE_SSL: "false"
    ports:
      - "3000:3000"
    profiles: ["app"]

volumes:
  pgdata:
